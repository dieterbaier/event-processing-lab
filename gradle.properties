# Event Processing Lab - Gradle Properties
# [semantic-anchor: event-processing-lab]

# Java compatibility
# org.gradle.java.home=/path/to/jdk-21

# Gradle settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.unsafe.configuration-cache=true

# Build settings
buildScan.termsOfServiceUrl=https://gradle.com/terms-of-service
buildScan.termsOfServiceAgree=yes

# Kafka Configuration [semantic-anchor: technology.kafka]
# Default Kafka bootstrap servers (can be overridden per module)
kafka.bootstrap.servers=localhost:9092
kafka.topic.orders=order-events
kafka.topic.payments=payment-events
kafka.group.id=event-processing-lab
kafka.auto.offset.reset=earliest
kafka.enable.auto.commit=false

# Kafka Producer Configuration
acks=all
retries=3
linger.ms=5
batch.size=16384
buffer.memory=33554432
max.block.ms=60000

# Kafka Consumer Configuration
auto.commit.interval.ms=5000
session.timeout.ms=30000
heartbeat.interval.ms=10000
max.poll.records=500
max.poll.interval.ms=300000

# Application Configuration
# Event generation rate (events per second)
event.generation.rate=10

# Payment timeout (milliseconds) for timeout detection scenarios [semantic-anchor: scenario.payment-timeout]
payment.timeout.ms=1800000

# Order lifecycle timeout (milliseconds) [semantic-anchor: scenario.order-cancellation]
order.timeout.ms=3600000

# Logging Configuration
logging.level.root=INFO
logging.level.com.example=DEBUG

# Flink Configuration [semantic-anchor: technology.flink]
flink.taskmanager.numberOfTaskSlots=2
flink.jobmanager.rpc.port=6123
flink.taskmanager.rpc.port=6122
flink.rest.port=8081

# Esper Configuration [semantic-anchor: technology.esper]
esper.engine.name=EventProcessingEngine
esper.threading.model=single-thread

# Module-specific overrides can be added in each module's gradle.properties
