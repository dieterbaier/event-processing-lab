// Event Processing Lab - Gradle Settings
// [semantic-anchor: event-processing-lab]

// Define all modules in the multi-module project
rootProject.name = 'event-processing-lab'

// Include all modules
include('event-model')
include('event-producer')
include('kafka-consumer')
include('esper-cep')
include('flink-basic')
include('flink-cep')

// Configure module paths (all in root directory)
project(':event-model').projectDir = file('event-model')
project(':event-producer').projectDir = file('event-producer')
project(':kafka-consumer').projectDir = file('kafka-consumer')
project(':esper-cep').projectDir = file('esper-cep')
project(':flink-basic').projectDir = file('flink-basic')
project(':flink-cep').projectDir = file('flink-cep')

